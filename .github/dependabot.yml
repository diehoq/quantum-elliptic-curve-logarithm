version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned to a specific commit of the eclipse-qrisp/Qrisp fix branch; bump manually.
      - dependency-name: "qrisp"
      # Qrisp requires flask<2.3.0, and Flask 2.2 does not work with Werkzeug 3.
      - dependency-name: "flask"
        versions: [">=2.3.0"]
      - dependency-name: "werkzeug"
        versions: [">=3.0.0"]
      # Qrisp pins jax/jaxlib==0.7.1 and sympy<=1.13.
      - dependency-name: "jax"
      - dependency-name: "jaxlib"
      - dependency-name: "sympy"
        versions: [">1.13"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
