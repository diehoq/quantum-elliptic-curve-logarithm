name: Qrisp elliptic curve unit tests via Pytest

on: [push]

# Least privilege: the tests only need to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        test_file:
          - tests/test_ec_addition.py
          - tests/test_ec_controlled_addition.py
          - tests/test_ec_doubling.py
          - tests/test_ec_mult_add.py
          - tests/test_kaliski_mod_inv.py

    steps:
      # Third-party actions are pinned to full commit SHAs (tag in comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test with pytest
        env:
          TEST_FILE: ${{ matrix.test_file }}
        run: |
          pytest "$TEST_FILE"
