name: Qrisp elliptic curve unit tests via Pytest

on: [push]

# Least privilege: the tests only need to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        test_file:
          - tests/test_ec_addition.py
          - tests/test_ec_controlled_addition.py
          - tests/test_ec_doubling.py
          - tests/test_ec_mult_add.py
          - tests/test_kaliski_mod_inv.py

    steps:
      # Third-party actions are pinned to full commit SHAs (tag in comment).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test with pytest
        env:
          TEST_FILE: ${{ matrix.test_file }}
        run: |
          pytest "$TEST_FILE"
