name: Qrisp elliptic curve unit tests via Pytest

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        test_file:
          - tests/test_ec_addition.py
          - tests/test_ec_controlled_addition.py
          - tests/test_ec_doubling.py
          - tests/test_ec_mult_add.py
          - tests/test_kaliski_mod_inv.py

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test with pytest
        run: |
          pytest ${{ matrix.test_file }}
